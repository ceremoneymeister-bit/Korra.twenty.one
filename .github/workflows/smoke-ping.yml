# Диагностический пинг: если даже он виснет в pending с 0 джобов —
# дело в аккаунте (минуты Actions), а не в наших воркфлоу.
name: smoke-ping
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke-ping.yml']
jobs:
  ping:
    runs-on: [self-hosted, linux, x64]
    steps:
      - run: echo "pong $(date -u)"
